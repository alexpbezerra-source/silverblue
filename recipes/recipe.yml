---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: silverblue
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/silverblue-main
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /
  - type: bling
    install:
      - rpmfusion # Installs RPM Fusion free, nonfree, and tainted repositories

  - type: script
    snippets:
      # 1. Ensure /var/opt or appropriate directory symlinks exist to prevent cpio errors
      - mkdir -p /var/opt
   
      - |
        cat << 'EOF' > /etc/yum.repos.d/google-chrome.repo
        [google-chrome]
        name=google-chrome
        baseurl=http://dl.google.com/linux/chrome/rpm/stable/x86_64
        skip_if_unavailable=True
        gpgcheck=1
        gpgkey=https://dl.google.com/linux/linux_signing_key.pub
        enabled=1
        enabled_metadata=1
        EOF

  - type: dnf  

    remove:
      packages:
        - libavdevice-free
        - libavcodec-free
        - libavfilter-free
        - libavformat-free
        - libavutil-free
        - libpostproc-free
        - libswresample-free
        - libswscale-free
        - ffmpeg-free
    
    install:
      packages:
        - steam
        - google-chrome-stable
        - distrobox
        - gnome-tweaks
        - ffmpeg
        - btop
        - groupinstall "GNOME"
  
  
  - type: signing # this sets up the proper policy & signing files for signed images to work fully
